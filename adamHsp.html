<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.restart{
    margin-top:30px;
    font-size:20px;
}

</style>

</head>
<body>

<h1>🦸 איזה גיבור על אתה? 🦸</h1>

<div id="game"></div>

<script>

/* =====================================================
   אזור 1 - הגיבורים
   הילדים יכולים לשנות שמות, תמונות וכוחות
   ===================================================== */

let heroes = {


fire:{
name:"  סופר תינוק",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiZdZGbdoJ9z8_cyC9HbBxNSbrqTKSZfDsGA&s",
power1:"https://c8.alamy.com/comp/M8RTGG/super-baby-girl-flying-M8RTGG.jpg",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuhBa1sqbB-jfbNkKOjrwbhjKugNiUg14OLA&s",
description:"יורה מוצצים וכדורי חיתולים ."
},

ice:{
name: "איש הנעלים ",
image:"https://thumbs.dreamstime.com/b/elegant-dachshund-dog-leather-men-shoes-funny-parquetry-53944732.jpg",
power1:"https://i.pinimg.com/originals/88/6c/26/886c26d87c5fd4e89a8f229b332bc48d.jpg",
power2:"https://img4.dhresource.com/webp/m/0x0/f3/albu/jc/y/17/54069093-e161-41dc-be89-2643cb9be9f3.jpg",
description:"לירות נעלים מסריחות."
},

lightning:{
name:"אדון החומוס ",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtbxhlYahueWBT6POfcTisle5BONRqjO7Jcg&s",
power1:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrsecQGQD3YBEqzezvESdJzSN-b19rvxlRiA&s",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTteFh9pe8iAcp9sLjAxgbVXZXz_i3LWctU6Q&s",
description:"לזמן מבול חומוס מהידים."
}

};


/* =====================================================
   אזור 2 - שאלות
   ===================================================== */

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["חמידות ","fire"],
["ריח לא טוב ","ice"],
["תם ","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["לירות מוצצים","fire"],
["לירות נעלים","ice"],
["לזמן מבול חומוס","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["כדור חיתול","fire"],
["לרות ממש מהר נעלים","ice"],
["לזמן החי חזק שהפשר  חומוס","lightning"]
]
}

];


/* =====================================================
   משתני משחק
   ===================================================== */

let fire;
let ice;
let lightning;
let step;


/* =====================================================
   התחלת משחק
   ===================================================== */

function startGame(){

fire = 0;
ice = 0;
lightning = 0;

step = 0;

showQuestion();

}


/* =====================================================
   הצגת שאלה
   ===================================================== */

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;

}

document.getElementById("game").innerHTML = html;

}


/* =====================================================
   בחירת תשובה
   ===================================================== */

function choose(type){

if(type=="fire"){
fire++;
}

if(type=="ice"){
ice++;
}

if(type=="lightning"){
lightning++;
}

step++;

if(step < questions.length){

showQuestion();

}
else{

showResult();

}

}


/* =====================================================
   הצגת תוצאה
   ===================================================== */

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML =

`
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage"
src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">

<img src="${hero.power1}">

<img src="${hero.power2}">

</div>

<button class="restart"
onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;

}


/* =====================================================
   התחלת המשחק בעת פתיחת הדף
   ===================================================== */

startGame();

</script>

</body>
</html>
