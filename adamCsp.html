<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:20px;
}
</style>

</head>
<body>

<div id="game"></div>

<script>

let heroes = {


fire:{
name:"גיבור הגלקסיה",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKFdj29Aq_zQiyRfGFBaxKIuEKR1VTlaa03g&s",
power1:"https://cdn.waterstones.com/bookjackets/large/9781/4052/9781405269438.jpgv",
power2:"https://www.hayadan.org.il/images/content3/2012/06/pinwheel-580x435.jpg",
description:"  שולט בכל הגלקסיות ויכול  להשמיד את הכל",
},



ice:{
name:" גיבור הכל  ",
image:"https://picsum.photos/300?4",
power1:"https://picsum.photos/180?5",
power2:"https://picsum.photos/180?6",
description:"יכול לעשות הכל  יש לו את כל הכוחות."
},

lightning:{
name:"איש האלמנטים ",
image:"https://picsum.photos/300?7",
power1:"https://picsum.photos/180?8",
power2:"https://picsum.photos/180?9",
description:"יכול לשלוט בכ האלמנטים ולהשמיד דברים איתם."
}

};

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["יום חם 🔥","fire"],
["יום מושלג ❄️","ice"],
["סערת ברקים ⚡","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["ליצור אש","fire"],
["להקפיא דברים","ice"],
["לשלוט בחשמל","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["כדור אש","fire"],
["מלכודת קרח","ice"],
["מכת ברק","lightning"]
]
}

];

let fire;
let ice;
let lightning;
let step;

function startGame(){

fire = 0;
ice = 0;
lightning = 0;
step = 0;

showQuestion();
}

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;
}

document.getElementById("game").innerHTML = html;
}

function choose(type){

if(type==="fire") fire++;
if(type==="ice") ice++;
if(type==="lightning") lightning++;

step++;

if(step < questions.length){
showQuestion();
}else{
showResult();
}
}

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML = `
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage" src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">
<img src="${hero.power1}">
<img src="${hero.power2}">
</div>

<br>

<button onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;
}

startGame();

</script>

</body>
</html>
