<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.restart{
    margin-top:30px;
    font-size:20px;
}

</style>

</head>
<body>

<h1>🦸 איזה גיבור על אתה? 🦸</h1>

<div id="game"></div>

<script>

/* =====================================================
   אזור 1 - הגיבורים
   הילדים יכולים לשנות שמות, תמונות וכוחות
   ===================================================== */

let heroes = {


fire:{
name:"איש הלייזר ",
image:"https://rubybot.co.il/_next/image?url=https%3A%2F%2Fapi.rubybot.co.il%2Fgenerated_images%2FBUrNGOQaoEeYloipPPQDlhzuElzxdhqPGVNSAvIjZZVFlPYSoUVhZZIpTEnOrWUQ.jpeg&w=1080&q=75",
power1:"https://rubybot.co.il/_next/image?url=https%3A%2F%2Fapi.rubybot.co.il%2Fgenerated_images%2FAefnTkOFmWcJkxpkYkkQkEMwxchGHCmzJOMjleVABEWJDxhCuEjinFEtWemyNybE.jpeg&w=1080&q=75",
power2:"1.png",
description:"שולט בלייזר, יוצר כדורי לייזר ומגן לייזר."
},

ice:{
name:"איש הגודל ",
image:"https://rubybot.co.il/_next/image?url=https%3A%2F%2Fapi.rubybot.co.il%2Fgenerated_images%2FTcVYjANevsDfsWCspfzuUBRzYMxTWqzcRvRLPhNDBGSJuXhWEtOXCnxNtZaiQWXL.jpeg&w=1080&q=75",
power1:"2.png",
power2:"3.png",
description:"מגדיל את עצמו ובונה חומות גדולות."
},

lightning:{
name:"איש החשמל ",
image:"5.png",
power1:"4.png",
power2:"6.png",
description:"רץ במהירות על ומזמן חשמל."
}

};


/* =====================================================
   אזור 2 - שאלות
   ===================================================== */

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["יום של לייזר ","fire"],
["יום גדול ","ice"],
["סערת חשמל ","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["ליצור כדורי לייזר","fire"],
["להגדיל דברים","ice"],
["לשלוט בחשמל","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["סופות לייזר","fire"],
["מלכודות גודל","ice"],
["מכת חשמל","lightning"]
]
}

];


/* =====================================================
   משתני משחק
   ===================================================== */

let fire;
let ice;
let lightning;
let step;


/* =====================================================
   התחלת משחק
   ===================================================== */

function startGame(){

fire = 0;
ice = 0;
lightning = 0;

step = 0;

showQuestion();

}


/* =====================================================
   הצגת שאלה
   ===================================================== */

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;

}

document.getElementById("game").innerHTML = html;

}


/* =====================================================
   בחירת תשובה
   ===================================================== */

function choose(type){

if(type=="fire"){
fire++;
}

if(type=="ice"){
ice++;
}

if(type=="lightning"){
lightning++;
}

step++;

if(step < questions.length){

showQuestion();

}
else{

showResult();

}

}


/* =====================================================
   הצגת תוצאה
   ===================================================== */

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML =

`
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage"
src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">

<img src="${hero.power1}">

<img src="${hero.power2}">

</div>

<button class="restart"
onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;

}


/* =====================================================
   התחלת המשחק בעת פתיחת הדף
   ===================================================== */

startGame();

</script>

</body>
</html>
